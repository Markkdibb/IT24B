<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

</head>
<body>
<h1> Hello World</h1>

<h4> Username</h4>

<input type = "text" id="textbox" placeholder="type something here..."
oninput="updateDisplay()">
<br>

<h4>Password</h4>
<input type="password" id="password" placeholder="type your password here..." oninput="recordPassword()">

<h4 id="displayText">Your text will appear here</h1>

<script>

function updateDisplay(){
    var textbox = document.getElementById("textbox");
    var displayText = document.getElementById("displayText");

    displayText.textContent = textbox.value;
    console.log(textbox.value + " " + Date());
}


function recordPassword(){
    var password = document.getElementById("password");
    console.log("Your password is: " + password.value + " " + Date());
}
</script>
